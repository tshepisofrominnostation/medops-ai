# MedOps AI console theme. Kept in the repo so a hosted deploy looks like the local one.
[theme]
base = "dark"
primaryColor = "#38a8f5"
backgroundColor = "#071426"
secondaryBackgroundColor = "#102641"
textColor = "#f3f7fc"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
